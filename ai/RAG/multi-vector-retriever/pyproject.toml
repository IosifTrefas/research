[tool.poetry]
name = "multi-vector-retriever"
version = "0.0.1"
description = "Multi-vector retriever for RAG"
authors = ["Iosif Trefas <iosif.tre@gmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
numpy = ">=1.26.0,<2"
langgraph = ">=0.2.6"
langchain-ollama = ">=0.1.0"
langchain-openai = ">=0.1.22"
langchain = ">=0.2.14"
python-dotenv = ">=1.0.1"
langchain-community = "<0.3.23"
langchain-postgres = ">=0.0.12"
beautifulsoup4 = ">=4.12.2"
pypdf = ">=5.1.0"
psycopg = { version = ">=3.2.4", extras = ["binary"] }
setuptools = ">=75.8.0"
langsmith = ">=0.3.2"
langgraph-checkpoint-sqlite = ">=2.0.3"
duckduckgo-search = ">=7.3.0"
langgraph-cli = ">=0.1.73"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"